version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The starter reuses Stage and ChatMessage across RPCs to keep the
    # teaching example small. A production API should give every RPC its own
    # <Method>Request and <Method>Response so each can evolve independently.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
